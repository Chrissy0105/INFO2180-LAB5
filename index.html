<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World Database Lookup</title>
    <link rel="stylesheet" href="world.css">
    <script src="world.js" type="text/javascript"></script>
</head>
<body>
    <header>
        <h1>World Database Lookup</h1>
    </header>

    <main>
        <div id="controls">
            <label for="country">Country:</label>
            <input id="country" type="search" name="country" placeholder="Enter country">
            <button id="lookup">Lookup</button>
        </div>

        <div id="result">
            <!-- Countries or cities will appear here -->
        </div>
    </main>
</body>
</html>
